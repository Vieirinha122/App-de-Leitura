<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Daily Read</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafaf9; color: #1c1917; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .container { text-align: center; max-width: 320px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-family: Georgia, serif; font-size: 1.75rem; color: #1c1917; margin-bottom: 8px; }
    p { color: #78716c; line-height: 1.6; margin-bottom: 24px; }
    button { background: #1c1917; color: #fafaf9; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 500; }
    button:hover { background: #292524; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📖</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('online', () => window.location.reload());
    }
  </script>
</body>
</html>
