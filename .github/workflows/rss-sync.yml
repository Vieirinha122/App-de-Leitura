name: RSS Sync

on:
  # TESTE AGORA (11:40 BRT = 14:40 UTC) — descomente a linha abaixo para testar hoje
  schedule:
    - cron: '46 14 * * *'   # roda às 11:40 BRT (14:40 UTC)

  # PRODUÇÃO — 6h e 20h BRT (9h e 23h UTC) — descomente quando validar
  # schedule:
  #   - cron: '0 9 * * *'    # 06:00 BRT
  #   - cron: '0 23 * * *'   # 20:00 BRT

  # Permite rodar manual a qualquer momento (Actions → Run workflow)
  workflow_dispatch:

jobs:
  sync:
    name: Sync RSS Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Acorda Render + Neon (keep-alive leve via /health)
      - name: Wake up services
        run: |
          echo "🌅 Acordando Render + Neon..."
          curl -sf "https://app-de-leitura.onrender.com/api/health" || true
          sleep 10
          curl -sf "https://app-de-leitura.onrender.com/api/health" || true

      # 2. Dispara sync com secret
      - name: Trigger RSS Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "🔄 Disparando sync..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://app-de-leitura.onrender.com/api/cron/sync")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" = "503" ]; then
            echo "⚠️ DB ainda acordando, aguardando e tentando novamente..."
            sleep 30
            # Retry once
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "x-cron-secret: $CRON_SECRET" \
              "https://app-de-leitura.onrender.com/api/cron/sync")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)
            echo "Retry Status: $http_code"
            echo "Retry Response: $body"
          fi
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Sync falhou com status $http_code"
            exit 1
          fi
          
          echo "✅ Sync concluído com sucesso"